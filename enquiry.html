<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nail Assist | Service Enquiry</title>

    <meta name="description"
          content="Enquire about Nail Assist manicure, pedicure, nail art and other nail care services.">

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="services_1.html">Services</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="enquiry.html">Enquiry</a></li>
        </ul>
    </nav>

    <header>
        <h1>Service Enquiry</h1>
        <p>Interested in one of our nail services? Send us an enquiry.</p>
    </header>

    <main>
        <form id="enquiryForm">

            <label for="customerName">Full Name:</label>
            <input type="text" id="customerName"
                   name="customerName" required>

            <label for="customerEmail">Email Address:</label>
            <input type="email" id="customerEmail"
                   name="customerEmail" required>

            <label for="customerPhone">Phone Number:</label>
            <input type="tel" id="customerPhone"
                   name="customerPhone" required>

            <label for="service">Choose a Service:</label>
            <select id="service" name="service" required>
                <option value="">Select a service</option>
                <option value="Manicure">Manicure - R180</option>
                <option value="Pedicure">Pedicure - R250</option>
                <option value="Nail Art">Nail Art - R150</option>
                <option value="Gel Nails">Gel Nails - R300</option>
                <option value="Acrylic Nails">Acrylic Nails - R350</option>
                <option value="Nail Repair">Nail Repair - R80 per nail</option>
            </select>

            <label for="message">Additional Information:</label>
            <textarea id="message" name="message"
                      rows="5" required></textarea>

            <button type="submit">Submit Enquiry</button>

            <p id="enquiryResponse" aria-live="polite"></p>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Nail Assist. All rights reserved.</p>
    </footer>

</body>
</html>
