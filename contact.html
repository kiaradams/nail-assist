<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nail Assist | Contact Us</title>

    <meta name="description"
          content="Contact Nail Assist for general questions, feedback and information about our nail care services.">

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="services_1.html">Services</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="enquiry.html">Enquiry</a></li>
        </ul>
    </nav>

    <header>
        <h1>Contact Nail Assist</h1>
        <p>We would love to hear from you!</p>
    </header>

    <main>
        <form id="contactForm">

            <label for="contactName">Full Name:</label>
            <input type="text" id="contactName"
                   name="contactName" required>

            <label for="contactEmail">Email Address:</label>
            <input type="email" id="contactEmail"
                   name="contactEmail" required>

            <label for="messageType">Type of Message:</label>
            <select id="messageType" name="messageType" required>
                <option value="">Choose a message type</option>
                <option value="General Question">General Question</option>
                <option value="Feedback">Feedback</option>
                <option value="Complaint">Complaint</option>
                <option value="Other">Other</option>
            </select>

            <label for="contactMessage">Your Message:</label>
            <textarea id="contactMessage"
                      name="contactMessage"
                      rows="6" required></textarea>

            <button type="submit">Prepare Email</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Nail Assist. All rights reserved.</p>
    </footer>

</body>
</html>
